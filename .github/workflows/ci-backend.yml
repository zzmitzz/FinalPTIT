name: CI Pipeline - Backend

on:
  push:
    branches:
      - master

env:
  IMAGE_NAME: ${{ vars.IMAGE_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          IMAGE_TAG="${SHORT_SHA}-${TIMESTAMP}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${IMAGE_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          ref: ${{ vars.GITOPS_BRANCH }}
          path: gitops

      - name: Update image tag in manifest
        run: |
          cd gitops

          sed -i "s|image: \(docker\.io/\)\?${{ env.IMAGE_NAME }}:.*|image: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}|g" ${{ vars.GITOPS_FILE_PATH }}

          echo "=== Updated manifest ==="
          cat ${{ vars.GITOPS_FILE_PATH }}

      - name: Commit and push to GitOps repo
        run: |
          cd gitops
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add ${{ vars.GITOPS_FILE_PATH }}
          git commit -m "Update ${{ vars.CONTAINER_NAME }} image to ${{ steps.tag.outputs.IMAGE_TAG }}" || echo "No changes to commit"
          git push origin ${{ vars.GITOPS_BRANCH }}

      - name: Job Summary
        run: |
          echo "## CI Pipeline Completed Successfully ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Name:** ${{ vars.CONTAINER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitOps Repo:** ${{ vars.GITOPS_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitOps Branch:** ${{ vars.GITOPS_BRANCH }}" >> $GITHUB_STEP_SUMMARY
