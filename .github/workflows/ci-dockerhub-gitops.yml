name: Build and push image, update GitOps

on:
  push:
    branches: ["main"]
    paths:
      - "be/**"
      - ".github/workflows/ci-dockerhub-gitops.yml"
  workflow_dispatch:

env:
  IMAGE_REPO: ${{ vars.IMAGE_REPO }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_CONTEXT: be
  DOCKERFILE: be/Dockerfile

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    if: ${{ env.IMAGE_REPO != '' && env.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      full_image: ${{ steps.img.outputs.full }}
      short_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::5}
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_REPO }}:latest
          provenance: false

      - name: Export image ref
        id: img
        run: |
          SHORT_SHA=${{ steps.meta.outputs.sha }}
          echo "full=${{ env.IMAGE_REPO }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  update-gitops:
    name: Update GitOps repository
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITOPS_REPO: ${{ vars.GITOPS_REPO }}
      GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH }}
      GITOPS_FILE_PATH: ${{ vars.GITOPS_FILE_PATH }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      FULL_IMAGE: ${{ needs.build-and-push.outputs.full_image }}
      SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
    steps:
      - name: Validate configuration
        run: |
          set -e
          for var in GITOPS_REPO GITOPS_BRANCH GITOPS_FILE_PATH FULL_IMAGE SHORT_SHA; do
            if [ -z "${!var}" ]; then echo "Missing required env: $var"; exit 1; fi
          done

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Install yq (for robust YAML updates)
        run: |
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag in GitOps file
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail
          echo "Updating $GITOPS_FILE_PATH to image: $FULL_IMAGE"
          if [ ! -f "$GITOPS_FILE_PATH" ]; then
            echo "File not found: $GITOPS_FILE_PATH" >&2
            exit 1
          fi

          if [ -n "${CONTAINER_NAME:-}" ]; then
            # Target a specific container name in a Deployment/Pod spec
            yq -i "(.spec.template.spec.containers[] | select(.name == \"$CONTAINER_NAME\").image) = \"$FULL_IMAGE\"" "$GITOPS_FILE_PATH"
          else
            # Default: first container image
            yq -i ".spec.template.spec.containers[0].image = \"$FULL_IMAGE\"" "$GITOPS_FILE_PATH"
          fi

          echo "Post-update image lines:"
          yq '.spec.template.spec.containers[].image' "$GITOPS_FILE_PATH"

      - name: Commit and push changes
        id: commit
        working-directory: gitops
        shell: bash
        run: |
          set -e
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          
          git add "$GITOPS_FILE_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit (image already up to date)."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          git commit -m "chore: update backend image to ${SHORT_SHA}

Updated image: ${FULL_IMAGE}
Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          
          git push origin "${GITOPS_BRANCH}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create PR in GitOps repo (optional)
        if: ${{ vars.GITOPS_CREATE_PR == 'true' && steps.commit.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        working-directory: gitops
        run: |
          set -e
          BRANCH="chore/update-backend-image-${SHORT_SHA}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Update backend image to ${SHORT_SHA}" \
            --body "$(cat <<EOF
  Automated update from ${GITHUB_REPOSITORY}@${GITHUB_SHA}

  Image: ${FULL_IMAGE}
  EOF
  )" \
              --base "${GITOPS_BRANCH}" \
              --head "$BRANCH" || true
